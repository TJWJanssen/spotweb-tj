# Spotweb with MariaDB and a background retriever.
#
#   cd docker
#   cp .env.example .env      # and set DB_PASSWORD
#   docker compose up -d
#   open http://localhost:8080  (first login: admin / admin - change it right away)
#
# The image is pulled from the GitHub Container Registry (built by the "Docker image"
# workflow). To build it from this checkout instead (run from this folder):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# The web container creates/upgrades the database schema on start; the retriever
# container then fetches new spots on a timer. Configure your usenet server in
# Spotweb (Config > Spotweb settings) before expecting any spots.
name: spotweb

x-spotweb-image: &spotweb-image ${SPOTWEB_IMAGE:-ghcr.io/tjwjanssen/spotweb-tj:latest}

x-spotweb-env: &spotweb-env
  DB_HOST: db
  DB_PORT: "3306"
  DB_NAME: ${DB_NAME:-spotweb}
  DB_USER: ${DB_USER:-spotweb}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
  PHP_TIMEZONE: ${PHP_TIMEZONE:-Europe/Amsterdam}

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-spotweb}
      MARIADB_USER: ${DB_USER:-spotweb}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Spotweb stores millions of comments: give InnoDB a decent buffer pool and allow big insert batches.
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL:-512M}
      - --max-allowed-packet=${DB_MAX_ALLOWED_PACKET:-64M}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    image: *spotweb-image
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *spotweb-env
      SPOTWEB_RUN_UPGRADE: "1"
      SPOTWEB_COOKIE_HOST: ${SPOTWEB_COOKIE_HOST:-}
    ports:
      - "${SPOTWEB_PORT:-8080}:80"
    # volumes:
    #   - ../ownsettings.php:/var/www/html/ownsettings.php:ro
    healthcheck:
      # becomes healthy once the schema upgrade at startup has finished
      test: ["CMD-SHELL", "test -f /tmp/spotweb-ready && curl -fsS -o /dev/null http://localhost/install.php"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  retriever:
    image: *spotweb-image
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      <<: *spotweb-env
      RETRIEVE_INTERVAL: ${RETRIEVE_INTERVAL:-900}
    # retrieve.php takes a lock, so overlapping runs are refused instead of corrupting data.
    command:
      - sh
      - -c
      - |
        while true; do
          php retrieve.php || true
          sleep "$${RETRIEVE_INTERVAL}"
        done

volumes:
  db-data:
